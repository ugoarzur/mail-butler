[general]
# Where to store databases and models
# data_dir = "~/.local/share/mail-butler/"
log_level = "INFO"

[classifier]
# Classification method: "rules", "sklearn", "llm", "auto"
# "auto" chains: rules -> sklearn -> llm (fallback)
method = "auto"
ollama_model = "qwen3.5:latest"
ollama_base_url = "http://localhost:11434"
confidence_threshold = 0.7
batch_size = 50

# Add one [[accounts]] section per mailbox.
# Credentials should be set via environment variables, not in this file.
# For account "personal", set:
#   MAIL_BUTLER_PERSONAL_USERNAME="you@gmail.com"
#   MAIL_BUTLER_PERSONAL_PASSWORD="your-app-password"

[[accounts]]
name = "work-google"
host = "imap.gmail.com"
port = 993
ssl = true
auth_method = "app_password"
# username and password loaded from env vars
folders = ["INBOX"]

